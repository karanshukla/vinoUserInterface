name: release

# A v* tag publishes that version to crates.io once the checks pass again.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      # crates.io trusted publishing: a short-lived token for this run, no stored secret.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: The tag names the version in Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # The GitHub Release. Its notes are generated by GitHub: the PRs merged
  # since the previous tag. After the publish: a crates.io version can never be
  # re-uploaded, a Release can.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub Release
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout, so gh can't infer the repo.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "On crates.io: https://crates.io/crates/vino-user-interface/${GITHUB_REF_NAME#v}" \
            --verify-tag
