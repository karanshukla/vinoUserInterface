[package]
name = "vino-user-interface"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT AND OFL-1.1 AND Apache-2.0"
description = "The egui theme and widgets shared by vinoSearch, vinoWhisper and vinoSpeak"
repository = "https://github.com/karanshukla/vinoUserInterface"
readme = "README.md"
keywords = ["egui", "theme", "widgets", "accessibility", "gui"]
categories = ["gui"]
# What a build needs: the code, the fonts it embeds and their licences.
include = ["/src", "/assets/fonts", "/README.md", "/LICENSE"]

# Only egui: the apps bring eframe. default_fonts stays on for the glyphs the
# bundled Latin subsets lack.
[dependencies]
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }

[dev-dependencies]
# wgpu and snapshot render tests/screenshots.rs, the README's pictures.
egui_kittest = { version = "0.37", default-features = false, features = ["wgpu", "snapshot"] }
# For examples/gallery.rs, the same as the apps build eframe with.
# Joins two renders into the side-by-side picture.
image = { version = "0.25", default-features = false, features = ["png"] }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
